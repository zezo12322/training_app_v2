<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Training App v2 - منصة تدريب ذكية مع نظام gamification متقدم">
  <meta name="keywords" content="تدريب,تعليم,كورسات,gamification,ذكاء اصطناعي">
  <meta name="author" content="Training App v2">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Training App v2">
  <meta property="og:description" content="منصة تدريب ذكية مع نظام gamification متقدم">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="Training App v2">
  <meta property="twitter:description" content="منصة تدريب ذكية مع نظام gamification متقدم">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Training App">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Training App v2 - منصة التدريب الذكية</title>
  <link rel="manifest" href="manifest.json">

  <!-- Firebase Configuration -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js"></script>

  <!-- Loading Screen Styles -->
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Cairo', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      overflow: hidden;
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .logo-container {
      margin-bottom: 40px;
      animation: pulse 2s ease-in-out infinite;
    }

    .logo {
      width: 120px;
      height: 120px;
      background: white;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .app-name {
      color: white;
      font-size: 28px;
      font-weight: bold;
      margin-top: 20px;
      text-align: center;
    }

    .app-tagline {
      color: rgba(255,255,255,0.8);
      font-size: 16px;
      margin-top: 8px;
      text-align: center;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-top: 30px;
    }

    .loading-text {
      color: white;
      font-size: 14px;
      margin-top: 20px;
      opacity: 0.9;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* RTL Support */
    [dir="rtl"] {
      direction: rtl;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .logo {
        width: 100px;
        height: 100px;
        font-size: 50px;
      }
      .app-name {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading">
    <div class="logo-container">
      <div class="logo">📚</div>
    </div>
    <div class="app-name">Training App v2</div>
    <div class="app-tagline">منصة التدريب الذكية</div>
    <div class="loading-spinner"></div>
    <div class="loading-text">جاري التحميل...</div>
  </div>

  <!-- Web Configuration -->
  <script src="web_config.js"></script>

  <!-- Flutter App -->
  <script>
    // Remove loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('hidden');
        setTimeout(() => loading.remove(), 500);
      }
    });

    // Fallback: Remove after 5 seconds if event doesn't fire
    setTimeout(function() {
      const loading = document.getElementById('loading');
      if (loading && !loading.classList.contains('hidden')) {
        loading.classList.add('hidden');
        setTimeout(() => loading.remove(), 500);
      }
    }, 5000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
