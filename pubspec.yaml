name: training_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  image_picker: ^1.2.0
  file_picker: ^10.3.3
  url_launcher: ^6.3.2
  record: ^6.1.1
  audioplayers: ^6.5.1
  onesignal_flutter: ^5.3.4
  intl: ^0.20.2
  flutter_launcher_icons: ^0.14.4
  flutter_riverpod: ^2.5.1
  freezed_annotation: ^2.4.4
  http: ^1.2.1
  json_annotation: ^4.9.0
  logger: ^2.2.0
  path_provider: ^2.1.4
  path: ^1.9.0
  mime: ^1.0.5
  shared_preferences: ^2.2.3
  rxdart: ^0.28.0
  flutter_localizations:
    sdk: flutter
  patrol: ^3.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.9.0
  mocktail: ^1.0.3
  fake_cloud_firestore: 4.0.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/icon.png
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

# <<< --- تم نقل هذا القسم إلى هنا ---
# تأكد من أنه يبدأ من أول السطر
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"